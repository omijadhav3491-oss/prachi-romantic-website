<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>

    <div id="hearts"></div>
    <div id="stars"></div>

    <div id="login">

            Open My Heart ❤️
         </button>
 
         <p id="message"></p>

         </div>
         <div class="photos">
         <h2>Our Memories 📸❤️</h2>

         <img src="images/photo1.jpg" alt="Our Memory" onclick="openPhoto(this.src)">
         <img src="images/photo2.jpg" alt="Our Memory" onclick="openPhoto(this.src)">
         </div>
  
         <script src="script.js"></script>


         <div class="memories">

         <h2>Our Memories ❤️</h2>

         <div class="memory-card">
         <h3>19 August 2017 ❤️</h3>
         <p>
            The day when our beautiful story began...
         </p>
          </div>

          <div class="memory-card">

         <p>
            Dombivli to Kondeshwar — 66 KM of beautiful memories.
        </p>
    </div>

</div>
<div class="music-player">
    <audio id="loveSong" src="music/tere-sang-yaara.mp3" loop></audio>

    </button>
</div>
